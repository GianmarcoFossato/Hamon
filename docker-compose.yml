services:
  mongo-app:
    image: mongo:7
    container_name: hamon-mongo-app
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_app_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongo-target:
    image: mongo:7
    container_name: hamon-mongo-target
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_target_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hamon-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - APP_MONGODB_URI=mongodb://mongo-app:27017/extraction_app_db
      - TARGET_MONGODB_URI=mongodb://mongo-target:27017/company_enterprise_db
      - BACKEND_PORT=8001
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o}
      - LITELLM_LOCAL_MODEL_COST_MAP=True
    volumes:
      - hamon_uploads_data:/app/data/uploads
    depends_on:
      mongo-app:
        condition: service_healthy
      mongo-target:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hamon-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8001
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api
    depends_on:
      - backend

volumes:
  mongo_app_data:
  mongo_target_data:
  hamon_uploads_data:
