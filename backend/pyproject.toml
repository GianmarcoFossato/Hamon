[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hamon-backend"
version = "0.1.0"
description = "Hamon data harmonization backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "pymongo>=4.10.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.4.0",
    "litellm>=1.50.0",
    "bdi-kit>=0.11.0",
    "pandas>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "filetype>=1.2.0",
    "json-schema-to-pydantic>=0.4.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
